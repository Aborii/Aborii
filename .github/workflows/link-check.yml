name: Check README Links

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    # Runs weekly on Monday at 07:00 UTC
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Fails the job when a URL stops resolving. GitHub emails the repository
      # owner when a scheduled workflow fails, which is the notification.
      - name: Check every URL in the README
        run: python3 .github/scripts/check_links.py
