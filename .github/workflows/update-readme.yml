name: Update README with Resume Data

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update README with resume data
        id: update
        run: |
          set +e
          python3 .github/scripts/update_readme.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = updated, 1 = already up to date, anything else is a real failure
          if [ "$code" -gt 1 ]; then
            echo "::error::Resume sync failed with exit code $code"
            exit "$code"
          fi

      - name: Commit and push changes
        if: steps.update.outputs.exit_code == '0'
        run: |
          git config --local user.email "almofleh.abdullah@gmail.com"
          git config --local user.name "Abdullah Almofleh"
          git add README.md
          git commit -m "chore: update README summary from resume data [skip ci]"
          git push
